name: Enviar classe para revisão
description: Envie uma classe criada pelo editor do compêndio para revisão.
title: "[Classe] "
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário para classes **Homebrew** ou **oficiais** cadastradas pelo editor.

        - Classe Base: 20 níveis e 15 Talentos de Classe — 3 opções em cada patamar de 4º, 8º, 12º, 16º e 20º nível.
        - Classe de Prestígio: 10 níveis e sem Talentos de Classe.
        - Homebrew de 20 níveis entra em **Homebrew**.
        - Homebrew de Prestígio entra em **Homebrew de Prestígio**.
        - Classe oficial deve usar uma família já existente no compêndio.
  - type: input
    id: author
    attributes:
      label: Autor
      description: Nome ou apelido que deve aparecer no compêndio.
      placeholder: Seu nome
    validations:
      required: true
  - type: input
    id: class_name
    attributes:
      label: Nome da classe
      placeholder: Discípulo do Dragão
    validations:
      required: true
  - type: dropdown
    id: class_origin
    attributes:
      label: Origem
      options:
        - Homebrew
        - Classe oficial
    validations:
      required: true
  - type: dropdown
    id: class_type
    attributes:
      label: Tipo de classe
      options:
        - Classe Base — 20 níveis
        - Classe de Prestígio — 10 níveis
    validations:
      required: true
  - type: textarea
    id: class_json
    attributes:
      label: Dados da classe
      description: Cole aqui o JSON copiado pelo botão "Enviar para revisão" do editor.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Confirmação
      options:
        - label: Entendo que a classe só será publicada após revisão e poderá ser ajustada ou recusada.
          required: true
