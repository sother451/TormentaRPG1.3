name: Aprovar Classe

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: class-approval
  cancel-in-progress: false

jobs:
  publicar:
    if: >
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/aprovar-classe') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar e validar classe
        run: node scripts/homebrew-from-issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}

      - name: Publicar no main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"

          git add src/data/homebrew/classes 2>/dev/null || true
          git add src/data/official/classes 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nenhuma alteração de classe foi gerada."
            exit 1
          fi

          git commit -m "classes: publicar classe aprovada da issue #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirmar publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Classe aprovada e publicada no **main** com sucesso."
          gh issue close ${{ github.event.issue.number }} --reason completed
