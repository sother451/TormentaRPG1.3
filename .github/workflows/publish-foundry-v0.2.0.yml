name: Publicar Sistema Foundry v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/foundry-release-payload/**'
      - '.github/workflows/publish-foundry-v0.2.0.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruir pacote e instalar arquivos
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/foundry-release-payload/payload.b64 > /tmp/foundry-payload.tar.xz
          tar -xJf /tmp/foundry-payload.tar.xz
          test -f foundry/sistema/system.json

          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('foundry/sistema/system.json', 'utf8'));
          if (manifest.version !== '0.2.0') throw new Error('Versão inesperada: ' + manifest.version);
          if (!String(manifest.manifest || '').includes('/foundry-v0.2.0/foundry/sistema/system.json')) {
            throw new Error('URL manifest não aponta para foundry-v0.2.0.');
          }
          if (!String(manifest.download || '').includes('/releases/download/foundry-v0.2.0/system.zip')) {
            throw new Error('URL download não aponta para foundry-v0.2.0/system.zip.');
          }
          NODE

          (
            cd foundry/sistema
            zip -qr /tmp/system.zip .
          )
          unzip -t /tmp/system.zip >/dev/null

      - name: Publicar arquivos do sistema no main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"

          git add foundry/sistema
          git rm -r .github/foundry-release-payload
          git rm .github/workflows/publish-foundry-v0.2.0.yml

          git commit -m "foundry: adiciona sistema v0.2.0"
          git push origin HEAD:main

      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/foundry-v0.2.0" >/dev/null 2>&1; then
            echo "A tag foundry-v0.2.0 já existe." >&2
            exit 1
          fi

          git tag -a foundry-v0.2.0 -m "Sistema Foundry v0.2.0"
          git push origin foundry-v0.2.0

          gh release create foundry-v0.2.0 /tmp/system.zip#system.zip \
            --title "Sistema Foundry v0.2.0" \
            --notes "Sistema Tormenta RPG 1.3 para Foundry VTT — versão 0.2.0."
