name: Ajustar Asset Foundry v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/foundry-release-asset/**'
      - '.github/workflows/replace-foundry-v0.2.0-asset.yml'

permissions:
  contents: write

jobs:
  substituir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruir ZIP original e validar hash
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/foundry-release-asset/system.b64 > /tmp/system.zip
          echo "85212ecb34c57c001357315065c81476335c450aa9f9e407dc81a4a92c715b89  /tmp/system.zip" | sha256sum -c -
          unzip -t /tmp/system.zip >/dev/null

      - name: Substituir asset da release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset foundry-v0.2.0 system.zip -y
          gh release upload foundry-v0.2.0 /tmp/system.zip#system.zip

      - name: Limpar arquivos temporários
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/foundry-release-asset
          git rm .github/workflows/replace-foundry-v0.2.0-asset.yml
          git commit -m "chore: remove payload temporário da release Foundry"
          git push origin HEAD:main
